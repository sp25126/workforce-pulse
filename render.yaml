services:
  # FastAPI Backend
  - type: web
    name: workforce-pulse-backend
    env: python
    rootDir: backend
    buildCommand: python -m pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: PYTHONPATH=. uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        sync: false # Set in Render dashboard
      - key: GROQ_API_KEY
        sync: false # Set in Render dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        value: '["*"]'

  # Next.js Frontend
  - type: web
    name: workforce-pulse-frontend
    env: node
    rootDir: frontend
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false # Set in Render dashboard (e.g. https://workforce-pulse-backend.onrender.com/api)
