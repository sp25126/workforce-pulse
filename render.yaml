services:
  # FastAPI Backend
  - type: web
    name: workforce-pulse-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Set in Render dashboard
      - key: CORS_ORIGINS
        value: '["*"]'

  # Next.js Frontend
  - type: web
    name: workforce-pulse-frontend
    env: node
    rootDir: frontend
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false # Set in Render dashboard (e.g. https://workforce-pulse-backend.onrender.com/api)
